<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GHOST PROTOCOL — ハッキング風ターミナルゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ============================================================
   デザイントークン（ターミナルは常に黒地＋緑文字。
   ライト／ダーク指定があっても同じ値を使う）
   ============================================================ */
:root {
  --bg: #020603;
  --panel: #04100a;
  --line: #0f3d1c;
  --fg: #3dff72;
  --dim: #1f9d45;
  --faint: #14602e;
  --warn: #ffd24a;
  --err: #ff4d5e;
  --info: #6fe3ff;
  --glow: 0 0 6px rgba(61, 255, 114, .55);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #020603; --panel: #04100a; --line: #0f3d1c; --fg: #3dff72; --dim: #1f9d45;
    --faint: #14602e; --warn: #ffd24a; --err: #ff4d5e; --info: #6fe3ff;
  }
}
:root[data-theme="dark"] {
  --bg: #020603; --panel: #04100a; --line: #0f3d1c; --fg: #3dff72; --dim: #1f9d45;
  --faint: #14602e; --warn: #ffd24a; --err: #ff4d5e; --info: #6fe3ff;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
body {
  font-family: "DotGothic16", ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK JP", "MS Gothic", monospace;
  font-size: 15px; line-height: 1.5; overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }

/* ---------- 全体レイアウト：HUD / ターミナル / ボタン列 ---------- */
#app {
  position: relative; height: var(--vh, 100%); max-width: 880px; margin: 0 auto;
  display: flex; flex-direction: column; background: var(--bg);
  text-shadow: var(--glow);
}
/* 走査線（CRT風）。操作は通す */
#app::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
}
#hud { flex: none; padding: 8px 12px 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
.hudrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 13px; }
.hudrow .host { color: var(--info); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: center; }
.hudrow .cr { color: var(--warn); }
#sndBtn { font: inherit; font-size: 12px; color: var(--dim); background: none; border: 1px solid var(--faint); border-radius: 3px; padding: 1px 6px; cursor: pointer; }
.trace { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 13px; }
.bar { flex: 1; height: 10px; border: 1px solid var(--dim); background: #010302; position: relative; }
#traceFill { height: 100%; width: 0; background: var(--fg); transition: width .35s, background .3s; box-shadow: 0 0 8px var(--fg); }
#tracePct { min-width: 3.2em; text-align: right; }
#app.mid #traceFill { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
#app.high #traceFill { background: var(--err); box-shadow: 0 0 10px var(--err); animation: pulse .6s infinite alternate; }
#app.high #tracePct { color: var(--err); }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }

#term { flex: 1; overflow-y: auto; padding: 10px 12px 14px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#term::-webkit-scrollbar { width: 6px; }
#term::-webkit-scrollbar-thumb { background: var(--faint); }
.ln { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.5em; }
.ln.cmd { color: #b8ffcc; }
.ln.dim { color: var(--dim); text-shadow: none; }
.ln.warn { color: var(--warn); text-shadow: 0 0 6px rgba(255,210,74,.4); }
.ln.err { color: var(--err); text-shadow: 0 0 6px rgba(255,77,94,.5); }
.ln.info { color: var(--info); text-shadow: none; }
.ln.big { font-size: 17px; letter-spacing: .04em; margin: 4px 0; }
.ln.glow { text-shadow: 0 0 10px var(--fg), 0 0 22px var(--fg); }
.ln.logo { white-space: pre; font-size: 14px; line-height: 1.15; color: var(--fg); margin-bottom: 6px; }
.ln.mail { color: #c9ffd8; border-left: 2px solid var(--dim); padding-left: 8px; margin: 4px 0; }
.lnk { color: var(--info); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; text-shadow: none; }
.lnk:hover { color: #fff; }
.pr { color: var(--dim); }

/* 入力行：本物の<input>は透明にして重ね、見た目は自前のカーソルで描く */
#promptLine { position: relative; display: block; overflow-wrap: anywhere; white-space: pre-wrap; min-height: 1.5em; }
#promptLine.hidden { display: none; }
#typed { color: #d6ffe0; }
#cursor { display: inline-block; width: .55em; height: 1.05em; background: var(--fg); vertical-align: text-bottom; margin-left: 1px; animation: blink 1s steps(1) infinite; box-shadow: 0 0 8px var(--fg); }
@keyframes blink { 50% { opacity: 0; } }
#inp { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; background: transparent; color: transparent; caret-color: transparent; outline: none; }

/* ---------- ショートカットボタン列（スマホ向け） ---------- */
#keys { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 10px; border-top: 1px solid var(--line); background: var(--panel); position: relative; z-index: 6; }
#keys button {
  font: inherit; font-size: 14px; color: var(--fg); background: #03150a; border: 1px solid var(--dim);
  border-radius: 4px; padding: 7px 11px; min-height: 38px; cursor: pointer; text-shadow: none;
}
#keys button.fill { color: var(--info); border-color: #1c6a80; }
#keys button:active { background: var(--dim); color: #001a08; }
#keys button:focus-visible, #sndBtn:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }

/* ---------- 演出：成功フラッシュ / 警報の揺れ ---------- */
#flash { position: absolute; inset: 0; z-index: 7; pointer-events: none; background: radial-gradient(circle, rgba(61,255,114,.35), rgba(61,255,114,0) 70%); opacity: 0; }
#app.flash #flash { animation: flashAnim .7s ease-out; }
@keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
#app.alarm #flash { background: radial-gradient(circle, rgba(255,77,94,.4), rgba(255,77,94,0) 70%); animation: flashAnim .9s ease-out 2; }
#app.shake #term { animation: shake .45s linear 2; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) {
  #cursor { animation: none; }
  #app.flash #flash, #app.alarm #flash, #app.shake #term, #app.high #traceFill { animation: none; }
}
</style>
</head>
<body>
<noscript>このゲームにはJavaScriptが必要です。</noscript>
<div id="app">
  <header id="hud">
    <div class="hudrow">
      <span id="hudStage">MISSION 1/5</span>
      <span class="host" id="hudHost">HOME</span>
      <span class="cr" id="hudCr">0 CR</span>
      <button id="sndBtn" type="button" aria-label="効果音の切り替え">SND OFF</button>
    </div>
    <div class="trace">
      <span>追跡度</span>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="traceBar"><div id="traceFill"></div></div>
      <span id="tracePct">0%</span>
    </div>
  </header>

  <main id="term" aria-live="polite">
    <div id="out"></div>
    <div id="promptLine" class="hidden"><span class="pr" id="prompt"></span><span id="typed"></span><span id="cursor"></span>
      <input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="コマンド入力">
    </div>
  </main>

  <nav id="keys" aria-label="コマンドショートカット">
    <button type="button" data-run="scan">scan</button>
    <button type="button" data-run="ls">ls</button>
    <button type="button" data-run="mail">mail</button>
    <button type="button" data-run="status">status</button>
    <button type="button" data-run="help">help</button>
    <button type="button" data-run="disconnect">disconnect</button>
    <button type="button" data-run="shop">shop</button>
    <button type="button" class="fill" data-run="cat">cat</button>
    <button type="button" class="fill" data-fill="crack ">crack</button>
    <button type="button" class="fill" data-fill="bypass ">bypass</button>
    <button type="button" class="fill" data-run="download">download</button>
    <button type="button" class="fill" data-run="connect">connect</button>
    <button type="button" data-hist="1">↑履歴</button>
  </nav>
  <div id="flash"></div>
</div>

<!-- ============================================================
     ② ゲームエンジン（入力・コマンド・演出）
     ============================================================ -->
<script>
(() => {
'use strict';
const TEST = typeof globalThis.__GP_TEST !== 'undefined';   // 自動テスト用フラグ（通常は未定義）
const SAVE_KEY = 'ghost_protocol_v1';
const STEALTH_MULT = [1, 0.8, 0.65, 0.5];                    // ステルスLvごとの追跡度倍率
const COST = { connect: 4, scan: 3, ls: 1, cat: 2, seek: 2, dl: 4, dlTarget: 5, ok: 4, hint: 6, badTarget: 2 };

/* ---------- ユーティリティ ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lnk = (label, cmd, mode = 'run') => `<span class="lnk" data-${mode}="${esc(cmd)}">${esc(label)}</span>`;
const sleep = (ms) => new Promise((r) => setTimeout(r, TEST ? 0 : ms));
const norm = (s) => String(s || '').trim().toLowerCase();

/* ---------- ゲーム状態 ---------- */
// S = セーブされる進行状況 / R = 現在のミッション挑戦（リロードでリセット）
const freshState = () => ({
  v: 1, stage: 0, cleared: 0, credits: 0,
  tools: { shift: false, hex: false, seek: false, hint: false },
  stealth: 0, wipes: 0, files: {}, hintIdx: {},
  stats: { cmds: 0, wrong: 0, over: 0 }, sound: false, done: false,
});
let S = freshState();
let R = null;
const STAGE = () => STAGES[S.stage];
function resetRun() {
  R = { host: null, trace: 0, hs: {}, known: [...STAGE().startHosts], trapped: {}, warned: 0 };
}
const H = () => STAGE().hosts[R.host];
const HS = () => (R.hs[R.host] ??= { fw: !!H().fw, open: [] });

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 保存不可でも続行 */ } }
function load() {
  try {
    const j = localStorage.getItem(SAVE_KEY);
    if (!j) return null;
    const o = JSON.parse(j);
    if (!o || typeof o !== 'object' || o.v !== 1) return null;
    const f = freshState();
    return Object.assign(f, o, { tools: Object.assign(f.tools, o.tools), stats: Object.assign(f.stats, o.stats) });
  } catch (e) { return null; }
}

/* ---------- 効果音（任意・既定OFF） ---------- */
let actx = null;
function beep(freq, dur = 0.08, type = 'square', vol = 0.04) {
  if (!S.sound || TEST) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) { /* 音が出せなくても問題なし */ }
}
const sfx = {
  ok: () => { beep(660, .08); setTimeout(() => beep(990, .12), 90); },
  bad: () => { beep(160, .25, 'sawtooth'); },
  alarm: () => { beep(220, .2, 'sawtooth'); setTimeout(() => beep(180, .3, 'sawtooth'), 220); },
};

/* ============================================================
   出力システム：キューに積んで1行ずつタイピング表示
   ============================================================ */
const Q = [];            // 出力キュー（行 / 効果 / 待機）
let typing = false;      // タイピング中か
let skip = false;        // タップ・Enterで早送り
const TEST_OUT = [];     // テスト時の出力ログ

// 表示文字列の '<' は、リンク用の <span> 以外すべてエスケープする（<ポート番号> などが消えないように）
function say(html, cls = '', instant = false) {
  html = String(html).replace(/<(?!\/?span\b)/g, '&lt;');
  Q.push({ html, cls, instant }); pump();
}
function fx(fn) { Q.push({ fn }); pump(); }
function pause(ms) { Q.push({ wait: ms }); pump(); }

async function pump() {
  if (typing) return;
  typing = true; setBusy(true);
  while (Q.length) {
    const it = Q.shift();
    if (it.fn) { it.fn(); continue; }
    if (it.wait) { if (!skip) await sleep(it.wait); continue; }
    await typeLine(it);
  }
  typing = false; skip = false; setBusy(false);
}

// 1行を表示。テキストノードを空にしてから少しずつ戻す（リンク等のタグは保持）
function typeLine(it) {
  return new Promise((res) => {
    if (TEST) { TEST_OUT.push(String(it.html).replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')); return res(); }
    const out = $('#out');
    const div = document.createElement('div');
    div.className = 'ln ' + (it.cls || '');
    div.innerHTML = it.html;
    out.appendChild(div);
    while (out.childElementCount > 700) out.removeChild(out.firstChild);
    scrollDown();
    if (skip || it.instant || !div.textContent.trim()) return res();
    const nodes = [];
    const w = document.createTreeWalker(div, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = w.nextNode())) { nodes.push([n, n.nodeValue]); n.nodeValue = ''; }
    const total = nodes.reduce((a, x) => a + x[1].length, 0);
    const per = Math.max(3, Math.ceil(total / 28));
    let shown = 0;
    const id = setInterval(() => {
      shown = skip ? total : Math.min(total, shown + per);
      let left = shown;
      for (const [nd, full] of nodes) { const k = Math.min(left, full.length); nd.nodeValue = full.slice(0, k); left -= k; }
      scrollDown();
      if (shown >= total) { clearInterval(id); res(); }
    }, 16);
  });
}
function scrollDown() { const t = $('#term'); t.scrollTop = t.scrollHeight; }

function setBusy(b) {
  $('#promptLine').classList.toggle('hidden', b);
  if (!b) {
    setPrompt();
    scrollDown();
    if (!matchMedia('(pointer: coarse)').matches) $('#inp').focus({ preventScroll: true });
  }
}

/* ---------- HUD ---------- */
function promptText() { return R && R.host ? `ghost@${R.host}:/$` : 'ghost@deck:~$'; }
function setPrompt() { $('#prompt').textContent = promptText() + ' '; }
function hud() {
  const t = R ? R.trace : 0;
  $('#hudStage').textContent = `MISSION ${Math.min(S.stage + 1, 5)}/5`;
  $('#hudHost').textContent = R && R.host ? R.host : 'HOME';
  $('#hudCr').textContent = `${S.credits} CR`;
  $('#traceFill').style.width = t + '%';
  $('#tracePct').textContent = t + '%';
  $('#traceBar').setAttribute('aria-valuenow', t);
  const app = $('#app');
  app.classList.toggle('mid', t >= 50 && t < 80);
  app.classList.toggle('high', t >= 80);
  $('#sndBtn').textContent = S.sound ? 'SND ON' : 'SND OFF';
}

/* ---------- 演出ヘルパー ---------- */
function flashApp(cls, ms) { const a = $('#app'); a.classList.remove(cls); void a.offsetWidth; a.classList.add(cls); setTimeout(() => a.classList.remove(cls), ms); }
function progress(label) {
  [25, 55, 80, 100].forEach((p) => {
    const n = Math.round(p / 10);
    say(`${label} [${'█'.repeat(n)}${'░'.repeat(10 - n)}] ${p}%`, 'dim');
    pause(110);
  });
}
function accessGranted(label) {
  progress(label);
  say('▓▓▓  ACCESS GRANTED  ▓▓▓', 'big glow');
  fx(() => { flashApp('flash', 700); sfx.ok(); });
}

/* ============================================================
   追跡度
   ============================================================ */
// 追跡度を v だけ加算（負で減算）。100%到達でゲームオーバー→ true を返す
function addRaw(v) {
  R.trace = Math.max(0, Math.min(100, R.trace + v));
  hud();
  if (R.trace >= 100) { gameOver(); return true; }
  if (R.trace >= 80 && R.warned < 2) { R.warned = 2; say('[!!] 追跡度 80% 超過。逆探知が目前だ。', 'err'); fx(sfx.alarm); }
  else if (R.trace >= 50 && R.warned < 1) { R.warned = 1; say('[!] 追跡度 50% 超過。ファイアウォールが警戒レベルを上げた。', 'warn'); }
  return false;
}
// 通常の行動コスト：ステルスで軽減 + ステージ固有の上乗せ（WARDEN）
function spend(base) { return addRaw(Math.ceil(base * STEALTH_MULT[S.stealth]) + (STAGE().extra || 0)); }
// 誤答・罠のペナルティ：ステルスでは軽減されない
function wrong(v) { S.stats.wrong++; save(); return addRaw(v != null ? v : STAGE().penalty); }

function gameOver() {
  S.stats.over++; save();
  say('', '');
  say('!!! 追跡度 100% !!!', 'err big');
  fx(() => { flashApp('alarm', 1800); flashApp('shake', 900); sfx.alarm(); });
  say('逆探知完了。回線が強制切断された……', 'err');
  say('痕跡が追跡班に特定された。', 'err');
  pause(500);
  resetRun(); hud();
  say('ミッションを最初からやり直す。(クレジットと持ち物は保持される)', 'warn');
  briefing();
}

/* ============================================================
   ステージ進行
   ============================================================ */
function mailsOpen() { return MAILS.filter((m) => m.at <= S.cleared); }

function briefing() {
  const st = STAGE();
  say(`━━ MISSION ${st.no}/5 : ${st.title} ━━`, 'big');
  st.brief.forEach((l) => say(l));
  say(`目標: ${st.goal}`, 'warn');
  say(`既知ホスト: ${R.known.map((h) => lnk(h, 'connect ' + h)).join('  ')}`);

/* ============================================================
   ファイル・サーバー操作の共通処理
   ============================================================ */
const needHost = () => { if (R.host) return true; say('どのホストにも接続していない。まず connect <ホスト名> を実行。', 'err'); return false; };
const reqList = (f) => (f.req == null ? [] : [].concat(f.req));
const fileOk = (f) => reqList(f).every((p) => HS().open.includes(p));
const findFile = (name) => H().files.find((f) => norm(f.name) === norm(name));
const missing = (f) => reqList(f).filter((p) => !HS().open.includes(p));

function denied(f) { say(`アクセス拒否: ${esc(f.name)} は PORT ${missing(f).join(' + ')} の解放が必要。`, 'err'); }

// 罠ファイル：作動すると大きく追跡度が上がる。作動済みなら何も起きない。true=ゲームオーバー
function trigger(f) {
  if (R.trapped[f.name]) { say('(罠はすでに作動済み。ファイルは空だ)', 'dim'); return true; }
  R.trapped[f.name] = 1;
  say('[ハニーポット作動] 偽ファイルへのアクセスが検知された！', 'err big');
  fx(() => { flashApp('alarm', 900); sfx.bad(); });
  wrong(f.trap);
  return true;
}

function learnHosts(f) {
  (f.learn || []).forEach((h) => {
    if (!R.known.includes(h)) { R.known.push(h); say(`新しいノードを発見: ${lnk(h, 'connect ' + h)}`, 'info'); }
  });
}

/* ============================================================
   シフト暗号・16進などの解読ツール
   ============================================================ */
function shiftText(t, n) {
  return t.replace(/[a-z]/gi, (c) => {
    const base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base - n) % 26 + 26) % 26 + base);
  });
}
function hexText(t) {
  const clean = t.replace(/\s+/g, '').replace(/^0x/i, '');
  if (!clean || clean.length % 2 || /[^0-9a-f]/i.test(clean)) return null;
  return clean.match(/../g).map((h) => { const c = parseInt(h, 16); return c >= 32 && c < 127 ? String.fromCharCode(c) : '?'; }).join('');
}

  S = freshState(); S.sound = snd;
  fx(() => { $('#out').innerHTML = ''; });
  say('データを初期化した。', 'warn');
  startStage();
};

/* ---------- コマンド実行 ---------- */
const HIST = []; let histPos = 0;
function echo(line) { say(`<span class="pr">${esc(promptText())}</span> ${esc(line)}`, 'cmd', true); }

function exec(line) {
  line = line.trim();
  if (!line) return;
  if (typing) { skip = true; return; }    // 出力中は早送りだけ
  echo(line);
  if (HIST[HIST.length - 1] !== line) HIST.push(line);
  histPos = HIST.length;
  const parts = line.split(/\s+/);
  const name = parts[0].toLowerCase();
  const fn = Object.prototype.hasOwnProperty.call(CMD, name) ? CMD[name] : null;
  if (!fn) { say(`コマンド「${esc(parts[0])}」は不明。help で一覧を表示。`, 'err'); return; }
  S.stats.cmds++;
  fn(parts.slice(1), line);
  hud();
}

/* ============================================================
   入力まわり（キーボード・ボタン・リンク）
   ============================================================ */
function fill(text) { const i = $('#inp'); i.value = text; syncTyped(); i.focus(); }
function syncTyped() { $('#typed').textContent = $('#inp').value; scrollDown(); }

function tabComplete() {
  const i = $('#inp'); const v = i.value;
  const m = v.match(/^(\S*)(?:\s+(.*))?$/); if (!m) return;
  const [, c, rest] = m;
  if (rest === undefined) {
    const hit = Object.keys(CMD).filter((k) => k.startsWith(c.toLowerCase()));
    if (hit.length === 1) { i.value = hit[0] + ' '; syncTyped(); }
    return;
  }
  const pool = R.host ? [...H().files.map((f) => f.name), ...R.known] : ['ascii.txt', ...Object.keys(S.files), ...R.known];
  const hit = pool.filter((k) => k.toLowerCase().startsWith(rest.toLowerCase()));
  if (hit.length === 1) { i.value = c + ' ' + hit[0]; syncTyped(); }
}

function initUI() {
  const inp = $('#inp');
  inp.addEventListener('input', syncTyped);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); const v = inp.value; inp.value = ''; syncTyped(); exec(v); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (HIST.length) { histPos = Math.max(0, histPos - 1); inp.value = HIST[histPos] || ''; syncTyped(); } }
    else if (e.key === 'ArrowDown') { e.preventDefault(); histPos = Math.min(HIST.length, histPos + 1); inp.value = HIST[histPos] || ''; syncTyped(); }
    else if (e.key === 'Tab') { e.preventDefault(); tabComplete(); }
  });
  // 画面タップ：タイピング中は早送り、通常時は入力欄にフォーカス
  $('#term').addEventListener('click', (e) => {
    if (typing) { skip = true; return; }
    const t = e.target.closest && e.target.closest('.lnk');
    if (t) {
      if (t.dataset.run) exec(t.dataset.run);
      else if (t.dataset.fill) fill(t.dataset.fill);
      return;
    }
    if (!window.getSelection().toString()) inp.focus({ preventScroll: true });
  });
  // ショートカットボタン
  $('#keys').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (typing) { skip = true; return; }
    if (b.dataset.run) exec(b.dataset.run);
    else if (b.dataset.fill) fill(b.dataset.fill);
    else if (b.dataset.hist && HIST.length) { histPos = Math.max(0, histPos - 1); fill(HIST[histPos] || ''); }
  });
  $('#sndBtn').addEventListener('click', () => { S.sound = !S.sound; save(); hud(); sfx.ok(); });
  // ソフトキーボード表示時に高さを合わせる
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const f = () => {
      if (vv.height < window.innerHeight - 120) document.documentElement.style.setProperty('--vh', vv.height + 'px');
      else document.documentElement.style.removeProperty('--vh');
      window.scrollTo(0, 0); scrollDown();
    };
    vv.addEventListener('resize', f);
  }
}

/* ============================================================
   起動
   ============================================================ */
const LOGO = String.raw`  ____ _   _  ___  ____ _____
 / ___| | | |/ _ \/ ___|_   _|
| |  _| |_| | | | \___ \ | |
| |_| |  _  | |_| |___) || |
 \____|_| |_|\___/|____/ |_|
   P R O T O C O L  //  v1.0`;

function boot() {
  const saved = load();
  if (saved) S = saved;
  resetRun(); hud();
  say(LOGO, 'logo', true);
  say('※ この物語の組織・ホスト・ツール・脆弱性はすべて架空のものです。', 'dim');
  say('[ OK ] ghost-deck 起動\n[ OK ] 匿名回線 確立\n[ OK ] 追跡監視モジュール 待機中');
  if (saved && (S.cleared > 0 || S.stats.cmds > 0)) {
    say('セーブデータを読み込んだ。 (最初から: newgame yes)', 'warn');
    if (S.done) { say('全ミッション完了済み。メールを読み返そう。', 'info'); return; }
    briefing();
  } else {
    say('ようこそ、ゴースト。', 'info');
    briefing();
  }
}

if (TEST) {
  globalThis.__GP = { exec, boot, S: () => S, R: () => R, out: TEST_OUT, settle: async () => { while (typing || Q.length) await new Promise((r) => setTimeout(r, 0)); }, STAGES, freshState,
    setState: (s) => { S = s; resetRun(); } };
} else {
  initUI();
  boot();
}
})();
</script>
